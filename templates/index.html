{% load static %}
<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Muhammadsafo | Backend Developer</title>
    <link rel="icon" href="{% static 'favicon.png' %}">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

<div class="cursor" id="cursor"></div>
<div id="particles-js"></div>

<div class="container">
    <h1>Hi 👋 I'm Muhammadsafo 🚀</h1>
    <h2 id="typed-text"></h2>
    <p>I build powerful backend systems using Django & Python.</p>

    <div class="section">
        <h3>💻 Tech Stack</h3>
        <div class="tech">
            <div class="badge"><i class="fab fa-python"></i><span>Python<br>95%</span></div>
            <div class="badge"><i class="fas fa-leaf"></i><span>Django<br>80%</span></div>
            <div class="badge"><i class="fas fa-database"></i><span>PostgreSQL<br>75%</span></div>
            <div class="badge"><i class="fab fa-html5"></i><span>HTML<br>100%</span></div>
            <div class="badge"><i class="fab fa-css3-alt"></i><span>CSS<br>100%</span></div>
            <div class="badge"><i class="fas fa-rocket"></i><span>Dart<br>50%</span></div>
        </div>
    </div>

    <audio id="bgMusic" loop preload="auto">
        <source src="{% static 'audio/background-music.mp3' %}" type="audio/mpeg">
    </audio>

    <div class="music-control">
        <button id="musicBtn" class="music-btn" title="Music on/off">
            <i id="musicIcon" class="fas fa-play"></i>
        </button>
    </div>

    <div class="socials">
        <h3><br>🌐 Connect</h3>
        <div style="margin-top: 20px;" class="social-links">
            <a href="https://www.instagram.com/xabi.ljonov2012/" target="_blank"><i class="fab fa-instagram"></i></a>
            <a href="https://www.pinterest.com/mxabiljonov/" target="_blank"><i class="fab fa-pinterest"></i></a>
            <a href="https://t.me/Thebest_org_2012" target="_blank"><i class="fab fa-telegram"></i></a>
        </div>
    </div>

    <div class="footer">
        © 2026 Muhammadsafo | Built with Django 🚀
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/particles.js"></script>
<script src="https://cdn.jsdelivr.net/npm/typed.js@2.0.12"></script>

<script>
    // Typed Text - Titrashni oldini olish uchun
    new Typed("#typed-text", {
        strings: ["Backend Developer", "Django Enthusiast", "Python Developer", "Telegram Bot Developer"],
        typeSpeed: 60,
        backSpeed: 40,
        loop: true
    });

    // Particles background
    particlesJS("particles-js", {
        particles: {
            number: { value: 80 },
            color: { value: "#00ffcc" },
            shape: { type: "circle" },
            opacity: { value: 0.5 },
            size: { value: 3 },
            move: { enable: true, speed: 2 },
            line_linked: { enable: true, color: "#00ffcc", opacity: 0.2 }
        }
    });

    // Music control
    const music = document.getElementById("bgMusic");
    const musicBtn = document.getElementById("musicBtn");
    const musicIcon = document.getElementById("musicIcon");

    musicBtn.addEventListener("click", () => {
        if (music.paused) {
            music.play();
            musicIcon.classList.replace("fa-play", "fa-pause");
        } else {
            music.pause();
            musicIcon.classList.replace("fa-pause", "fa-play");
        }
    });

    // Cursor movement
    const cursor = document.getElementById("cursor");
    window.addEventListener("mousemove", (e) => {
        cursor.style.left = e.clientX + "px";
        cursor.style.top = e.clientY + "px";
    });

    document.querySelectorAll('a, button, .badge').forEach(item => {
        item.addEventListener('mouseenter', () => cursor.classList.add('expand'));
        item.addEventListener('mouseleave', () => cursor.classList.remove('expand'));
    });
</script>
</body>
</html>
